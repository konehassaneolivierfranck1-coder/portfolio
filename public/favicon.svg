<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#bc13fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0a0a0c" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.6" />
  <!-- H letter -->
  <path d="M 26 28 L 26 72 M 26 50 L 46 50 M 46 28 L 46 72" fill="none" stroke="url(#cyberGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- K letter -->
  <path d="M 58 28 L 58 72 M 58 50 L 76 28 M 63 45 L 77 72" fill="none" stroke="#00f3ff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
